name: Release or Deploy
on: 
  pull_request:
    branches: [devel]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'maven'
      - name: Release or Deploy
        run: ./releaseOrDeploy.sh
        env:
          GA_SSH_KEY: ${{ secrets.GA_SSH_KEY }}
